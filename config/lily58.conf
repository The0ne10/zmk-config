# config/lily58.conf

# ------------------------------------------------------------
# Lily58 / nice!nano / ZMK
# Stable Bluetooth-oriented config
# ------------------------------------------------------------

# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment to enable the Lily58 OLED Display
# CONFIG_ZMK_DISPLAY=y


# ------------------------------------------------------------
# Bluetooth stability
# ------------------------------------------------------------

# Increase BLE transmit power.
# Useful if keyboard randomly disconnects or has unstable connection.
# Trade-off: battery may drain a bit faster.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y


# ------------------------------------------------------------
# Battery reporting
# ------------------------------------------------------------

# Show keyboard battery level to host.
# Important: on split keyboards host usually shows central half battery,
# not necessarily both halves.
CONFIG_ZMK_BATTERY_REPORTING=y


# ------------------------------------------------------------
# Power / sleep
# ------------------------------------------------------------

# Increase idle timeout to 10 minutes.
# This is NOT deep sleep. It just delays idle behavior.
CONFIG_ZMK_IDLE_TIMEOUT=600000

# Do NOT enable deep sleep for now while debugging random BLE disconnects.
# Deep sleep can save battery, but it can also complicate wake-up behavior.
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000


# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------

# Keep logging disabled for normal wireless use.
# Enable only temporarily when debugging over USB.
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y
