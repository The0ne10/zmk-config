# config/lily58.conf

# ------------------------------------------------------------
# Disable deep sleep / soft off while debugging split disconnect
# ------------------------------------------------------------

CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_PM_SOFT_OFF=n

# Idle оставляем обычный. В idle Bluetooth должен оставаться подключённым.
CONFIG_ZMK_IDLE_TIMEOUT=30000


# ------------------------------------------------------------
# Split BLE stability
# ------------------------------------------------------------

# Lily58 = одна peripheral-половинка.
# Явно фиксируем, чтобы central не ждал лишние части.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

# Увеличиваем мощность BLE.
# ZMK сам рекомендует это при unstable connection,
# и отдельно пишет, что это может улучшить связь между split-половинками.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Иногда помогает при странных BLE-коннектах.
CONFIG_BT_CTLR_PHY_2M=n


# ------------------------------------------------------------
# Battery reporting
# ------------------------------------------------------------

CONFIG_ZMK_BATTERY_REPORTING=y


